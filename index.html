<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12304a">
  <title>Download IA</title>
  <style>
    :root { color-scheme: light; --navy:#12304a; --blue:#1769aa; --pale:#eef5fa; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(145deg, #eef5fa, #ffffff); color: #172b3a;
    }
    main {
      width: min(100%, 440px); text-align: center; background: #fff;
      border: 1px solid #dce6ee; border-radius: 24px; padding: 34px 26px;
      box-shadow: 0 14px 40px rgba(18,48,74,.10);
    }
    .mark {
      width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 20px;
      display: grid; place-items: center; background: var(--navy); color: white;
      font-size: 28px; font-weight: 800; letter-spacing: 1px;
    }
    h1 { margin: 0 0 8px; font-size: 28px; color: var(--navy); }
    p { margin: 0 0 24px; line-height: 1.55; color: #536777; }
    .store {
      display: block; text-decoration: none; margin: 12px 0; padding: 16px 18px;
      border-radius: 12px; background: var(--navy); color: white; font-weight: 700;
      border: 2px solid var(--navy); transition: transform .12s ease, background .12s ease;
    }
    .store.secondary { background: white; color: var(--navy); }
    .store:focus-visible { outline: 3px solid #70b7f0; outline-offset: 3px; }
    .store:hover { transform: translateY(-1px); }
    small { display: block; margin-top: 22px; color: #718391; line-height: 1.45; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">IA</div>
    <h1>Get the IA app</h1>
    <p>Choose your device's app store below to download the app.</p>
    <a class="store" href="https://play.google.com/store/apps/details?id=se.afaforsakring.ia&pcampaignid=web_share">
      Get it on Google Play
    </a>
    <a class="store secondary" href="https://apps.apple.com/in/app/ia-divergences-in-oh-s/id6443990571">
      Download on the App Store
    </a>
    <small>Opening this page on a phone? Choose the store for your device.</small>
  </main>
</body>
</html>
